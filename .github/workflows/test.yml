# ============================================================
# GitHub Actions: автоматическая проверка при каждом push.
#
# Что делает:
#   1. Поднимает виртуалку с Windows.
#   2. Ставит Python 3.11.
#   3. Ставит лёгкие зависимости (requirements-ci.txt).
#   4. Проверяет синтаксис (check_syntax.py).
#   5. Гоняет pytest (tests/).
#   6. Гоняет интент-тесты (tests/test_intents.py — без LLM/сети/озвучки).
#   7. Гоняет стресс-тест (tests/stress_intents.py — 100 ситуаций).
#   8. Проверяет, что SNAPSHOT.md не устарел (snapshot.py --check).
#
# Где смотреть результат:
#   На GitHub → вкладка "Actions" → последний запуск.
#
# Файл лежит в: .github/workflows/test.yml
# ============================================================

name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    # PYTHONUTF8=1 — включает UTF-8 mode интерпретатора.
    # Страховка от UnicodeEncodeError в cp1252-консоли GitHub Actions.
    # В коде тоже есть reconfigure — здесь глобально на весь job.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Check syntax
        run: python check_syntax.py

      # snapshot.py --check возвращает 1, если SNAPSHOT.md на диске
      # разошёлся с кодом. Локально opt-in pre-commit проверяет Git index;
      # сам снимок обновляется явно: python snapshot.py, затем staging.
      - name: Snapshot is up to date (SNAPSHOT.md)
        run: python snapshot.py --check

      - name: Unit tests (pytest)
        run: python -m pytest tests/ -q

      - name: Intent tests (без LLM, без сети, без озвучки)
        run: python tests/test_intents.py

      - name: Stress test (100 ситуаций, без LLM/сети)
        # Ситуации uia_* зависят от окружения: в CI нет uiautomation,
        # поэтому они проверяют понятный отказ «UI Automation недоступна».
        run: python tests/stress_intents.py